<!DOCTYPE html>
<html lang="de">
<head>

<title>Logos Bibel – Luther 1984</title>

<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#02040a">

<style>
* {
  box-sizing: border-box;
}

html {
  background: #02040a;
}

body {
  margin: 0;
  background: #02040a;
  color: #ffffff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  min-height: 100vh;
}

header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: #02040a;
  border-bottom: 1px solid #253044;
  padding: 14px 12px 11px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 23px;
  font-weight: 800;
}

header p {
  margin: 4px 0 0;
  color: #aeb9ca;
  font-size: 13px;
}

#app {
  max-width: 1000px;
  margin: auto;
  padding: 12px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
}

.tile {
  min-height: 72px;
  border: 2px solid #364258;
  border-radius: 12px;
  background: #111827;
  color: #ffffff;
  text-decoration: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 7px 4px;
  text-align: center;
  cursor: pointer;
  font: inherit;
  width: 100%;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}

.tile strong {
  display: block;
  font-size: 20px;
  line-height: 1.05;
}

.tile small {
  display: block;
  margin-top: 5px;
  font-size: 13px;
  line-height: 1.05;
  color: #eef3fb;
}

.tile:hover,
.tile:focus,
.tile.focused {
  border-color: #ffffff;
  box-shadow:
    0 0 0 3px #02040a,
    0 0 0 6px #ffffff;
  transform: scale(1.025);
}

.number {
  min-height: 64px;
}

.number strong {
  font-size: 23px;
}

.back {
  grid-column: 1 / -1;
  min-height: 58px;
  background: #182235;
  border-color: #6f809d;
  flex-direction: row;
  font-weight: 800;
  font-size: 17px;
}

.status {
  grid-column: 1 / -1;
  padding: 22px 10px;
  text-align: center;
  font-size: 17px;
  color: #d9e2f0;
}

.error {
  color: #ffd2d2;
}

/* Farbcodierung */

.moses {
  background: #15345f;
  border-color: #3679c7;
}

.history {
  background: #49351a;
  border-color: #a97835;
}

.wisdom {
  background: #493d13;
  border-color: #b39a32;
}

.major {
  background: #482147;
  border-color: #a54ca3;
}

.minor {
  background: #40272a;
  border-color: #9b565d;
}

.gospel {
  background: #154934;
  border-color: #36a878;
}

.acts {
  background: #16424a;
  border-color: #39a1b2;
}

.paul {
  background: #30305c;
  border-color: #7070c8;
}

.general {
  background: #3e3158;
  border-color: #8e6ec1;
}

.revelation {
  background: #562a20;
  border-color: #c0644b;
}

.chapter {
  background: #152033;
  border-color: #526783;
}

.verse {
  background: #102a25;
  border-color: #3b927c;
}

@media (max-width: 500px) {
  #app {
    padding: 8px;
  }

  .grid {
    gap: 6px;
  }

  .tile {
    min-height: 68px;
    border-radius: 10px;
  }

  .tile strong {
    font-size: 18px;
  }

  .tile small {
    font-size: 11px;
  }

  .number {
    min-height: 58px;
  }

  .number strong {
    font-size: 21px;
  }
}
</style>
</head>

<body>

<header>
  <h1 id="title">📖 Lutherbibel 1984</h1>
  <p id="subtitle">Buch auswählen</p>
</header>

<main id="app"></main>

<script>

  {abbr:"2 Chr", name:"2. Chronik", chapters:36, group:"history", biblia:"2-chronicles", corpus:"ii-chronicles"},
  {abbr:"Esra", name:"Esra", chapters:10, group:"history", biblia:"ezra", corpus:"ezra"},

  {abbr:"Apg", name:"Apostelgeschichte", chapters:28, group:"acts", biblia:"acts", corpus:"acts"},

  {abbr:"1 Kor", name:"1. Korinther", chapters:16, group:"paul", biblia:"1-corinthians", corpus:"i-corinthians"},
  {abbr:"2 Kor", name:"2. Korinther", chapters:13, group:"paul", biblia:"2-corinthians", corpus:"ii-corinthians"},
  {abbr:"Gal", name:"Galater", chapters:6, group:"paul", biblia:"galatians", corpus:"galatians"},
  {abbr:"Eph", name:"Epheser", chapters:6, group:"paul", biblia:"ephesians", corpus:"ephesians"},
  {abbr:"Phil", name:"Philipper", chapters:4, group:"paul", biblia:"philippians", corpus:"philippians"},
  {abbr:"Kol", name:"Kolosser", chapters:4, group:"paul", biblia:"colossians", corpus:"colossians"},

  {abbr:"2 Thess", name:"2. Thessalonicher", chapters:3, group:"paul", biblia:"2-thessalonians", corpus:"ii-thessalonians"},

  {abbr:"2 Tim", name:"2. Timotheus", chapters:4, group:"paul", biblia:"2-timothy", corpus:"ii-timothy"},
  {abbr:"Tit", name:"Titus", chapters:3, group:"paul", biblia:"titus", corpus:"titus"},
  {abbr:"Phlm", name:"Philemon", chapters:1, group:"paul", biblia:"philemon", corpus:"philemon"},

  // Allgemeine Briefe
  {abbr:"Hebr", name:"Hebräer", chapters:13, group:"general", biblia:"hebrews", corpus:"hebrews"},
  {abbr:"Jak", name:"Jakobus", chapters:5, group:"general", biblia:"james", corpus:"james"},
  {abbr:"1 Petr", name:"1. Petrus", chapters:5, group:"general", biblia:"1-peter", corpus:"i-peter"},
  {abbr:"2 Petr", name:"2. Petrus", chapters:3, group:"general", biblia:"2-peter", corpus:"ii-peter"},
  {abbr:"1 Joh", name:"1. Johannes", chapters:5, group:"general", biblia:"1-john", corpus:"i-john"},
  {abbr:"2 Joh", name:"2. Johannes", chapters:1, group:"general", biblia:"2-john", corpus:"ii-john"},
  {abbr:"3 Joh", name:"3. Johannes", chapters:1, group:"general", biblia:"3-john", corpus:"iii-john"},
  {abbr:"Jud", name:"Judas", chapters:1, group:"general", biblia:"jude", corpus:"jude"},

  // Offenbarung
  {abbr:"Offb", name:"Offenbarung", chapters:22, group:"revelation", biblia:"revelation-of-john", corpus:"revelation-of-john"}

let selectedBook = null;
let selectedChapter = null;
let focusIndex = 0;

/*
  Einige besonders wichtige LU84-Verszahlen werden lokal fest
  hinterlegt. Für alle anderen Kapitel wird die deutsche
  Verszählung dynamisch geladen.
*/
const localCounts = {
  "joel": {
    1: 20,
    2: 27,
    3: 5,
    4: 21
  }
};

/*
  Cache, damit bereits geladene Kapitel nicht erneut geladen
  werden müssen.
*/
const verseCache = {};

function setHeader(title, subtitle) {
  document.getElementById("title").textContent = title;
  document.getElementById("subtitle").textContent = subtitle;
}

function makeButton(html, className, action) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "tile " + className;
  button.innerHTML = html;
  button.addEventListener("click", action);
  return button;
}

function renderBooks() {
  selectedBook = null;
  selectedChapter = null;

  setHeader("📖 Lutherbibel 1984", "Buch auswählen");

  const app = document.getElementById("app");
  app.innerHTML = "";

  const grid = document.createElement("div");
  grid.className = "grid";

  books.forEach(book => {
    const tile = makeButton(
      "<strong>" + book.abbr + "</strong><small>" + book.name + "</small>",
      book.group,
      () => renderChapters(book)
    );

    grid.appendChild(tile);
  });

  app.appendChild(grid);
  resetFocus();
}

function renderChapters(book) {
  selectedBook = book;
  selectedChapter = null;

  setHeader(book.name, "Kapitel auswählen");

  const app = document.getElementById("app");
  app.innerHTML = "";

  const grid = document.createElement("div");
  grid.className = "grid";

  const back = makeButton(
    "← Bücher",
    "back",
    renderBooks
  );

  grid.appendChild(back);

  for (let chapter = 1; chapter <= book.chapters; chapter++) {
    const tile = makeButton(
      "<strong>" + chapter + "</strong>",
      "number chapter",
      () => renderVerses(book, chapter)
    );

    grid.appendChild(tile);
  }

  app.appendChild(grid);
  resetFocus();
}

async function getVerseCount(book, chapter) {

  const cacheKey = book.corpus + "-" + chapter;

  if (verseCache[cacheKey]) {
    return verseCache[cacheKey];
  }

  if (
    localCounts[book.corpus] &&
    localCounts[book.corpus][chapter]
  ) {
    verseCache[cacheKey] = localCounts[book.corpus][chapter];
    return verseCache[cacheKey];
  }

  /*
    Nur Metadaten/Versanzahl werden verwendet.
    Der Bibeltext selbst wird NICHT in unserer App angezeigt
    oder gespeichert.
  */
  const url =
    "https://cdn.jsdelivr.net/gh/sangchy1972/pd-text-corpus@main/" +
    "bibles/de/books/" +
    book.corpus +
    "/chapters/" +
    chapter +
    ".json";

  const response = await fetch(url, {
    cache: "force-cache"
  });

  if (!response.ok) {
    throw new Error("Versanzahl konnte nicht geladen werden.");
  }

  const data = await response.json();

  if (!data.verses || !Array.isArray(data.verses)) {
    throw new Error("Ungültige Versdaten.");
  }

  /*
    Nicht einfach data.verses.length verwenden:
    Wir lesen die höchste tatsächliche Versnummer aus.
  */
  let maxVerse = 0;

  data.verses.forEach(item => {
    const number = parseInt(item.verse, 10);
    if (!isNaN(number) && number > maxVerse) {
      maxVerse = number;
    }
  });

  if (maxVerse < 1) {
    throw new Error("Keine Verse gefunden.");
  }

  verseCache[cacheKey] = maxVerse;
  return maxVerse;
}

async function renderVerses(book, chapter) {
  selectedBook = book;
  selectedChapter = chapter;

  setHeader(
    book.name + " " + chapter,
    "Vers auswählen"
  );

  const app = document.getElementById("app");
  app.innerHTML = "";

  const grid = document.createElement("div");
  grid.className = "grid";

  const back = makeButton(
    "← Kapitel",
    "back",
    () => renderChapters(book)
  );

  grid.appendChild(back);

  const loading = document.createElement("div");
  loading.className = "status";
  loading.textContent = "Verse werden geladen …";
  grid.appendChild(loading);

  app.appendChild(grid);
  resetFocus();

  try {
    const verseCount = await getVerseCount(book, chapter);

    loading.remove();

    for (let verse = 1; verse <= verseCount; verse++) {

      /*
        Wir verwenden einen echten Link.
        Dadurch kommt die Navigation direkt aus dem
        Pinch/Klick des Benutzers und nicht aus
        window.location oder window.open.
      */

      const startVerse = Math.max(1, verse - 2);
      const endVerse = Math.min(verseCount, verse + 2);

      const href =
        "https://biblia.com/bible/lutbib1984/" +
        book.biblia +
        "/" +
        chapter +
        "/" +
        startVerse +
        "-" +
        endVerse;

      const link = document.createElement("a");

      link.className = "tile number verse";
      link.href = href;

      /*
        Absichtlich KEIN target="_blank".
        Auf der Brille soll derselbe Browserkontext
        benutzt werden.
      */

      link.innerHTML =
        "<strong>" + verse + "</strong>";

      link.setAttribute(
        "aria-label",
        book.name + " " + chapter + ", Vers " + verse
      );

      grid.appendChild(link);
    }

    resetFocus();

  } catch (error) {

    loading.className = "status error";
    loading.innerHTML =
      "Verszahlen konnten nicht geladen werden.<br>" +
      "Bitte Internetverbindung prüfen.";

    console.error(error);
    resetFocus();
  }
}

/* ------------------------------
   Tastatur / Neural-Band-Fokus
-------------------------------- */

function getFocusable() {
  return Array.from(
    document.querySelectorAll(".tile")
  );
}

function getColumnCount() {
  const grid = document.querySelector(".grid");

  if (!grid) return 5;

  const style = window.getComputedStyle(grid);
  const columns = style.gridTemplateColumns.split(" ");

  return Math.max(1, columns.length);
}

function resetFocus() {
  setTimeout(() => {
    const items = getFocusable();

    if (!items.length) return;

    focusIndex = 0;
    focusItem(focusIndex);
  }, 30);
}

function focusItem(index) {
  const items = getFocusable();

  if (!items.length) return;

  if (index < 0) index = 0;
  if (index >= items.length) index = items.length - 1;

  focusIndex = index;

  items.forEach(item => {
    item.classList.remove("focused");
  });

  const current = items[focusIndex];

  current.classList.add("focused");

  try {
    current.focus({
      preventScroll: true
    });
  } catch {
    current.focus();
  }

  current.scrollIntoView({
    behavior: "smooth",
    block: "center",
    inline: "center"
  });
}

function activateFocused() {
  const items = getFocusable();

  if (!items.length) return;

  const item = items[focusIndex];

  /*
    Bei einem <a> löst click() den echten href aus.
    Bei einem <button> wird die normale Auswahl ausgeführt.
  */
  item.click();
}

document.addEventListener("keydown", event => {

  const items = getFocusable();

  if (!items.length) return;

  const columns = getColumnCount();

  switch (event.key) {

    case "ArrowRight":
      event.preventDefault();
      focusItem(focusIndex + 1);
      break;

    case "ArrowLeft":
      event.preventDefault();
      focusItem(focusIndex - 1);
      break;

    case "ArrowDown":
      event.preventDefault();
      focusItem(focusIndex + columns);
      break;

    case "ArrowUp":
      event.preventDefault();
      focusItem(focusIndex - columns);
      break;

    case "Enter":
      event.preventDefault();
      activateFocused();
      break;
  }
});

/*
  KEINE Escape-/Backspace-Steuerung.
  KEINE Mittel-Finger-Geste.
  Die Meta-Systemgesten bleiben unangetastet.
*/

renderBooks();

</script>
