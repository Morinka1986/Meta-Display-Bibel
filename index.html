<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Logos Bibel – Luther 1984</title>

<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#02040a">

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: #02040a;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  min-height: 100vh;
}

header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: #02040a;
  border-bottom: 1px solid #253044;
  padding: 14px 12px 11px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 23px;
  font-weight: 800;
}

header p {
  margin: 4px 0 0;
  color: #aeb9ca;
  font-size: 13px;
}

#app {
  max-width: 1000px;
  margin: auto;
  padding: 12px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0,1fr));
  gap: 8px;
}

.tile {
  min-height: 72px;
  border: 2px solid #364258;
  border-radius: 12px;
  background: #111827;
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 7px 4px;
  text-align: center;
  cursor: pointer;
  font: inherit;
  width: 100%;
  outline: none;
}

.tile strong {
  font-size: 20px;
}

.tile small {
  margin-top: 5px;
  font-size: 13px;
  color: #eef3fb;
}

.tile:hover,
.tile:focus,
.tile.focused {
  border-color: #fff;
  box-shadow: 0 0 0 3px #02040a, 0 0 0 6px #fff;
  transform: scale(1.025);
}

.number { min-height:64px; }
.number strong { font-size:23px; }

.back {
  grid-column:1/-1;
  min-height:58px;
  background:#182235;
  border-color:#6f809d;
  flex-direction:row;
  font-weight:800;
  font-size:17px;
}

.status {
  grid-column:1/-1;
  padding:22px 10px;
  text-align:center;
  color:#d9e2f0;
}

.error { color:#ffd2d2; }

.reader-wrap {
  margin-top: 10px;
  width: 100%;
  height: calc(100vh - 155px);
  min-height: 400px;
  border: 2px solid #526783;
  border-radius: 12px;
  overflow: hidden;
  background: #fff;
}

.reader {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
  background: #fff;
}

.moses {background:#15345f;border-color:#3679c7;}
.history {background:#49351a;border-color:#a97835;}
.wisdom {background:#493d13;border-color:#b39a32;}
.major {background:#482147;border-color:#a54ca3;}
.minor {background:#40272a;border-color:#9b565d;}
.gospel {background:#154934;border-color:#36a878;}
.acts {background:#16424a;border-color:#39a1b2;}
.paul {background:#30305c;border-color:#7070c8;}
.general {background:#3e3158;border-color:#8e6ec1;}
.revelation {background:#562a20;border-color:#c0644b;}
.chapter {background:#152033;border-color:#526783;}
.verse {background:#102a25;border-color:#3b927c;}

@media(max-width:500px) {
  #app {padding:8px;}
  .grid {gap:6px;}
  .tile {min-height:68px;border-radius:10px;}
  .tile strong {font-size:18px;}
  .tile small {font-size:11px;}
  .number {min-height:58px;}
  .number strong {font-size:21px;}
}
</style>
</head>

<body>

<main id="app"></main>

{abbr:"2 Thess",name:"2. Thessalonicher",chapters:3,group:"paul",biblia:"2 Thessalonians",corpus:"ii-thessalonians"},

{abbr:"2 Tim",name:"2. Timotheus",chapters:4,group:"paul",biblia:"2 Timothy",corpus:"ii-timothy"},
{abbr:"Tit",name:"Titus",chapters:3,group:"paul",biblia:"Titus",corpus:"titus"},
{abbr:"Phlm",name:"Philemon",chapters:1,group:"paul",biblia:"Philemon",corpus:"philemon"},

{abbr:"Hebr",name:"Hebräer",chapters:13,group:"general",biblia:"Hebrews",corpus:"hebrews"},
{abbr:"Jak",name:"Jakobus",chapters:5,group:"general",biblia:"James",corpus:"james"},
{abbr:"1 Petr",name:"1. Petrus",chapters:5,group:"general",biblia:"1 Peter",corpus:"i-peter"},
{abbr:"2 Petr",name:"2. Petrus",chapters:3,group:"general",biblia:"2 Peter",corpus:"ii-peter"},
{abbr:"1 Joh",name:"1. Johannes",chapters:5,group:"general",biblia:"1 John",corpus:"i-john"},
{abbr:"2 Joh",name:"2. Johannes",chapters:1,group:"general",biblia:"2 John",corpus:"ii-john"},
{abbr:"3 Joh",name:"3. Johannes",chapters:1,group:"general",biblia:"3 John",corpus:"iii-john"},
{abbr:"Jud",name:"Judas",chapters:1,group:"general",biblia:"Jude",corpus:"jude"},

{abbr:"Offb",name:"Offenbarung",chapters:22,group:"revelation",biblia:"Revelation",corpus:"revelation-of-john"}

let selectedBook=null;
let selectedChapter=null;
let focusIndex=0;

const localCounts={
  joel:{1:20,2:27,3:5,4:21}
};

const verseCache={};

function setHeader(title,subtitle){
  document.getElementById("title").textContent=title;
  document.getElementById("subtitle").textContent=subtitle;
}

function makeButton(html,className,action){
  const b=document.createElement("button");
  b.type="button";
  b.className="tile "+className;
  b.innerHTML=html;
  b.addEventListener("click",action);
  return b;
}

function renderBooks(){
  selectedBook=null;
  selectedChapter=null;

  setHeader("📖 Lutherbibel 1984","Buch auswählen");

  const app=document.getElementById("app");
  app.innerHTML="";

  const grid=document.createElement("div");
  grid.className="grid";

  books.forEach(book=>{
    grid.appendChild(
      makeButton(
        "<strong>"+book.abbr+"</strong><small>"+book.name+"</small>",
        book.group,
        ()=>renderChapters(book)
      )
    );
  });

  app.appendChild(grid);
  resetFocus();
}

function renderChapters(book){
  selectedBook=book;
  selectedChapter=null;

  setHeader(book.name,"Kapitel auswählen");

  const app=document.getElementById("app");
  app.innerHTML="";

  const grid=document.createElement("div");
  grid.className="grid";

  grid.appendChild(
    makeButton("← Bücher","back",renderBooks)
  );

  for(let chapter=1;chapter<=book.chapters;chapter++){
    grid.appendChild(
      makeButton(
        "<strong>"+chapter+"</strong>",
        "number chapter",
        ()=>renderVerses(book,chapter)
      )
    );
  }

  app.appendChild(grid);
  resetFocus();
}

async function getVerseCount(book,chapter){

  const key=book.corpus+"-"+chapter;

  if(verseCache[key]) return verseCache[key];

  if(localCounts[book.corpus] && localCounts[book.corpus][chapter]){
    verseCache[key]=localCounts[book.corpus][chapter];
    return verseCache[key];
  }

  const url=
    "https://cdn.jsdelivr.net/gh/sangchy1972/pd-text-corpus@main/"+
    "bibles/de/books/"+
    book.corpus+
    "/chapters/"+
    chapter+
    ".json";

  const response=await fetch(url,{cache:"force-cache"});

  if(!response.ok){
    throw new Error("Versanzahl konnte nicht geladen werden");
  }

  const data=await response.json();

  if(!data.verses || !Array.isArray(data.verses)){
    throw new Error("Keine Versdaten");
  }

  let maxVerse=0;

  data.verses.forEach(item=>{
    const n=parseInt(item.verse,10);
    if(!isNaN(n) && n>maxVerse) maxVerse=n;
  });

  if(maxVerse<1) throw new Error("Keine Verse gefunden");

  verseCache[key]=maxVerse;
  return maxVerse;
}

async function renderVerses(book,chapter){

  selectedBook=book;
  selectedChapter=chapter;

  setHeader(book.name+" "+chapter,"Vers auswählen");

  const app=document.getElementById("app");
  app.innerHTML="";

  const grid=document.createElement("div");
  grid.className="grid";

  grid.appendChild(
    makeButton(
      "← Kapitel",
      "back",
      ()=>renderChapters(book)
    )
  );

  const loading=document.createElement("div");
  loading.className="status";
  loading.textContent="Verse werden geladen …";

  grid.appendChild(loading);
  app.appendChild(grid);

  try{

    const count=await getVerseCount(book,chapter);
    loading.remove();

    for(let verse=1;verse<=count;verse++){

      grid.appendChild(
        makeButton(
          "<strong>"+verse+"</strong>",
          "number verse",
          ()=>openReader(book,chapter,verse,count)
        )
      );

    }

    resetFocus();

  }catch(error){

    loading.className="status error";
    loading.innerHTML=
      "Verszahlen konnten nicht geladen werden.<br>"+
      "Bitte Internetverbindung prüfen.";

    console.error(error);
  }
}

/* ==============================
   LU84 READER INNERHALB DER APP
================================ */

function openReader(book,chapter,verse,verseCount){

  selectedBook=book;
  selectedChapter=chapter;

  const start=Math.max(1,verse-2);
  const end=Math.min(verseCount,verse+2);

  setHeader(
    book.name+" "+chapter+","+verse,
    "Lutherbibel 1984"
  );

  const app=document.getElementById("app");
  app.innerHTML="";

  const grid=document.createElement("div");
  grid.className="grid";

  grid.appendChild(
    makeButton(
      "← Verse",
      "back",
      ()=>renderVerses(book,chapter)
    )
  );

  app.appendChild(grid);

  const wrap=document.createElement("div");
  wrap.className="reader-wrap";

  const frame=document.createElement("iframe");
  frame.className="reader";

  /*
    Offizieller Biblia Embedded Bible Reader.
    LLS:1.0.591 = Lutherbibel 1984.
  */

  const reference=
    book.biblia+
    " "+
    chapter+
    ":"+
    start+
    "-"+
    end;

  const params=new URLSearchParams({
    layout:"minimal",
    resourceName:"LLS:1.0.591",
    startingReference:reference,
    navigationBox:"false",
    resourcePicker:"false",
    historyButtons:"false",
    shareButton:"false",
    textSizeButton:"false"
  });

  frame.src=
    "https://biblia.com/api/plugins/embeddedbible?"+
    params.toString();

  frame.title=
    "Lutherbibel 1984 – "+
    book.name+
    " "+
    chapter+
    ","+
    verse;

  frame.setAttribute("loading","eager");

  wrap.appendChild(frame);
  app.appendChild(wrap);

  resetFocus();
}

/* ==============================
   NEURAL BAND / TASTEN
================================ */

function getFocusable(){
  return Array.from(document.querySelectorAll(".tile"));
}

function getColumnCount(){

  const grid=document.querySelector(".grid");

  if(!grid) return 5;

  const style=window.getComputedStyle(grid);
  const columns=style.gridTemplateColumns.split(" ");

  return Math.max(1,columns.length);
}

function resetFocus(){

  setTimeout(()=>{

    const items=getFocusable();
    if(!items.length) return;

    focusIndex=0;
    focusItem(0);

  },30);
}

function focusItem(index){

  const items=getFocusable();
  if(!items.length) return;

  if(index<0) index=0;
  if(index>=items.length) index=items.length-1;

  focusIndex=index;

  items.forEach(item=>item.classList.remove("focused"));

  const current=items[index];

  current.classList.add("focused");

  try{
    current.focus({preventScroll:true});
  }catch{
    current.focus();
  }

  current.scrollIntoView({
    behavior:"smooth",
    block:"center",
    inline:"center"
  });
}

function activateFocused(){

  const items=getFocusable();
  if(!items.length) return;

  items[focusIndex].click();
}

document.addEventListener("keydown",event=>{

  const items=getFocusable();
  if(!items.length) return;

  const columns=getColumnCount();

  switch(event.key){

    case "ArrowRight":
      event.preventDefault();
      focusItem(focusIndex+1);
      break;

    case "ArrowLeft":
      event.preventDefault();
      focusItem(focusIndex-1);
      break;

    case "ArrowDown":
      event.preventDefault();
      focusItem(focusIndex+columns);
      break;

    case "ArrowUp":
      event.preventDefault();
      focusItem(focusIndex-columns);
      break;

    case "Enter":
      event.preventDefault();
      activateFocused();
      break;
  }
});

/*
  Keine Escape-/Backspace-Steuerung.
  Keine Mittelfinger-Geste.
  Meta-Systemgesten bleiben unangetastet.
*/

renderBooks();

</script>
